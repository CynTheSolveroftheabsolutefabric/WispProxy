<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WispProxy</title>
<style>
body{font:16px system-ui;margin:12px}input{padding:9px;min-width:0;flex:1}form{display:flex;gap:6px;margin:8px 0}iframe{width:100%;height:80vh;border:0}
</style>
<form id="connect"><input id="wisp" placeholder="Wisp WSS URL" required><button>Connect</button></form>
<form id="browse"><input id="url" placeholder="Website address" required><button>Go</button></form>
<iframe id="view"></iframe>
<script>
const w=document.querySelector("#wisp"),u=document.querySelector("#url"),v=document.querySelector("#view");
function address(s){s=s.trim();return /^https?:\/\//i.test(s)?s:/^[\w.-]+\.[a-z]{2,}/i.test(s)?"https://"+s:"https://www.google.com/search?q="+encodeURIComponent(s)}
function open(){const e=new URL(w.value.trim());if(!/^wss?:$/.test(e.protocol))throw Error("Use ws:// or wss://");e.protocol=e.protocol==="wss:"?"https:":"http:";e.pathname="/";e.search=e.hash="";const p=new URLSearchParams({embedded:"1",wisp:w.value.trim(),url:address(u.value)});v.src=e+"?"+p}
document.querySelector("#connect").onsubmit=e=>{e.preventDefault();try{open()}catch(x){alert(x.message)}};
document.querySelector("#browse").onsubmit=e=>{e.preventDefault();try{open()}catch(x){alert(x.message)}};
</script>
</html>
