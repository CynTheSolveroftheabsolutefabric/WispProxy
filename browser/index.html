<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WispProxy Browser</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    body{max-width:1200px;margin:auto;padding:1rem}header{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
    header input{flex:1;min-width:220px;margin:0}header button{width:auto;margin:0}
    #status{white-space:pre-wrap;min-height:1.5rem}iframe{width:100%;height:75vh;border:1px solid #777;border-radius:8px;background:white}
    .settings{display:flex;gap:.5rem;align-items:center}.settings input{flex:1;margin:0}
  </style>
  <script src="scram/scramjet.js"></script>
  <script src="controller/controller.api.js"></script>
</head>
<body>
  <main>
    <h2>WispProxy Browser</h2>
    <form id="settings" class="settings">
      <input id="wisp" type="url" placeholder="Wisp WebSocket endpoint (wss://…)" aria-label="Wisp WebSocket endpoint" required>
      <button type="submit">Connect</button>
    </form>
    <form id="navigate" class="settings">
      <input id="address" type="text" placeholder="Enter a website URL or search" aria-label="Website address" required>
      <button type="submit">Go</button>
    </form>
    <p id="status" role="status">Enter your active Wisp endpoint, then connect.</p>
    <iframe id="page" title="Proxied website" referrerpolicy="no-referrer"></iframe>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
