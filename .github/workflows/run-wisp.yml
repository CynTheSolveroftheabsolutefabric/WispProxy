name: Run Wisp Browser

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-wisp:
    runs-on: ubuntu-latest
    timeout-minutes: 185

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wisp dependencies
        run: npm install

      - name: Install browser dependencies
        working-directory: browser
        run: npm install

      - name: Build Scramjet browser
        working-directory: browser
        run: npm run build

      - name: Inspect Scramjet build output
        working-directory: browser
        run: |
          echo "Files in Scramjet output:"
          find dist/scram -maxdepth 3 -type f | sort
          echo "Checking expected entrypoint:"
          test -f dist/scram/scramjet.js && echo "FOUND" || echo "MISSING"

      - name: Start browser and Wisp server
        run: |
          npm start > wisp.log 2>&1 &
          echo $! > wisp.pid

      - name: Wait for service health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5001/health; then
              echo "Browser and Wisp server are responding."
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start:"
          cat wisp.log
          exit 1

      - name: Install cloudflared
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            --output cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Start Cloudflare Quick Tunnel
        run: |
          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:5001 > cloudflared.log 2>&1 &
          echo $! > cloudflared.pid

      - name: Publish browser and Wisp URLs
        run: |
          for attempt in $(seq 1 60); do
            TUNNEL_URL=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' cloudflared.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              {
                echo "## WispProxy Browser"
                echo
                echo "Browser: $TUNNEL_URL"
                echo
                printf "Wisp WebSocket: wss://%s/\n" "${TUNNEL_URL#https://}"
                echo
                echo "Paste the Wisp WebSocket URL into the browser's connection field."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "Browser URL: $TUNNEL_URL"
              exit 0
            fi
            sleep 2
          done
          echo "Cloudflare tunnel did not provide a URL:"
          cat cloudflared.log
          exit 1

      - name: Keep browser and tunnel online for 3 hours
        run: sleep 10800

      - name: Stop services
        if: always()
        run: |
          if [ -f cloudflared.pid ]; then
            kill "$(cat cloudflared.pid)" || true
          fi
          if [ -f wisp.pid ]; then
            kill "$(cat wisp.pid)" || true
          fi
